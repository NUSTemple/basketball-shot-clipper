[tool.poetry]
name = "shot-clipper"
version = "0.1.0"
description = "Detect and clip made basketball shots from fixed-camera video, with a manual labeling UI for building a goal/no-goal dataset"
authors = ["TAN PENG"]
license = "MIT"
readme = "README.md"
packages = [{ include = "shot_clipper", from = "src" }]

[tool.poetry.dependencies]
# torchvision explicitly excludes the single patch release 3.14.1 (unrelated
# upstream issue) - carve that one version out rather than broadly excluding 3.14.
python = ">=3.11,<3.14.1 || >3.14.1,<4.0"
flask = ">=3.0"
# For the hosted deployment's /api/uploads: mints a short-lived signed URL so
# the browser can PUT a video straight to GCS, bypassing Cloud Run's request
# size limit and the app's own compute time entirely. No-op locally (feature
# is gated on SHOT_CLIPPER_GCS_BUCKET being set) but kept in the base group,
# not `ml`, since label-ui's lightweight image needs it too.
google-cloud-storage = ">=2.18"

# Heavy CV/ML deps, only needed for calibrate/detect/clip - not for the
# label-ui app. Install with `poetry install --with ml`.
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
ultralytics = ">=8.2"
opencv-python = ">=4.9"
numpy = ">=1.26"
# Pinned explicitly (not just left to ultralytics' transitive range): on
# newer Python versions (e.g. 3.14) poetry's resolver can wander down to very
# old torch/torchvision versions that satisfy ultralytics' loose constraint
# on paper but have no compatible wheel published, and fail at install time.
# These versions are confirmed to have official wheels and to work together.
torch = ">=2.13"
torchvision = ">=0.28"
# for train_filter.py: trains a small classifier on data/dataset/labels.json
# to filter false positives out of find_makes()'s candidates
scikit-learn = ">=1.4"

# ONNX inference backend - an alternative to the torch/ultralytics path above.
# onnxruntime-directml is ~120MB and runs on any DirectX 12 GPU (NVIDIA, AMD,
# Intel) with no CUDA toolkit, against roughly 3GB for the CUDA torch wheels -
# see docs/GPU_SETUP.md. Kept optional and separate from `ml` so a checkout
# can install one, the other, or both - shot-clipper-compare-backends needs
# both at once.
[tool.poetry.group.onnx]
optional = true

[tool.poetry.group.onnx.dependencies]
# Windows-only wheel. Elsewhere (CI on Linux, macOS) plain onnxruntime is the
# equivalent; DirectML is what makes this work on non-NVIDIA hardware.
onnxruntime-directml = { version = ">=1.19", markers = "sys_platform == 'win32'" }
onnxruntime = { version = ">=1.19", markers = "sys_platform != 'win32'" }
# only needed to produce the .onnx file, not to run it - see
# shot-clipper-export-onnx
onnx = ">=1.16"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
shot-clipper-calibrate = "shot_clipper.calibrate_hoop:main"
shot-clipper-detect = "shot_clipper.detect_shots:main"
shot-clipper-clip = "shot_clipper.clip_shots:main"
shot-clipper-validate = "shot_clipper.validate:main"
shot-clipper-build-dataset = "shot_clipper.build_dataset:main"
shot-clipper-contact-sheet = "shot_clipper.contact_sheet:main"
shot-clipper-train-filter = "shot_clipper.train_filter:main"
shot-clipper-label-ui = "shot_clipper.label_ui.app:main"
shot-clipper-worker-server = "shot_clipper.label_ui.worker_server:main"
shot-clipper-export-onnx = "shot_clipper.inference:main"
shot-clipper-compare-backends = "shot_clipper.compare_backends:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
