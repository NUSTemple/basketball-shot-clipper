<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload a video</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d10;
      --bg-elevated: #16181d;
      --bg-input: #101318;
      --border: #262932;
      --border-strong: #383c47;
      --text: #eef0f3;
      --text-dim: #9a9fac;
      --text-dimmer: #676c78;
      --accent: #5b8cff;
      --accent-bg: rgba(91, 140, 255, 0.12);
      --goal: #4ade80;
      --nogoal: #f87171;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 18px;
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(900px 500px at 100% -10%, rgba(91,140,255,0.08), transparent),
        var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%; max-width: 460px; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .brand-emoji { font-size: 22px; }
    h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
    .subtitle { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin: 10px 0 24px; }

    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 36px 20px; text-align: center;
      color: var(--text-dim); cursor: pointer; transition: border-color 0.15s var(--ease), background 0.15s var(--ease), color 0.15s var(--ease);
    }
    .drop:hover { border-color: var(--text-dim); }
    .drop.drag { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .drop-icon { font-size: 26px; opacity: 0.8; }
    .drop-label { font-size: 13.5px; }
    .drop-hint { font-size: 11.5px; color: var(--text-dimmer); }
    input[type=file] { display: none; }

    .bar-track { background: var(--border); border-radius: 999px; height: 8px; margin-top: 18px; overflow: hidden; }
    .bar-fill { background: var(--accent); height: 100%; width: 0%; border-radius: 999px; transition: width 0.2s var(--ease); }
    .status { margin-top: 10px; font-size: 12.5px; color: var(--text-dim); min-height: 16px; }
    .status.error { color: var(--nogoal); }
    .status.done { color: var(--goal); }

    button {
      margin-top: 18px; width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: none;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: filter 0.12s var(--ease), transform 0.08s var(--ease);
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-emoji">🏀</span><h1>Upload a video</h1></div>
    <p class="subtitle">
      Uploads go straight to storage — this page never routes the file through
      the app server, so there's no size limit here beyond your own connection.
    </p>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/mp4,video/quicktime,.mp4,.mov">
      <span class="drop-icon">📹</span>
      <span class="drop-label" id="drop-label">Click to choose a video, or drag one here</span>
      <span class="drop-hint">MP4 or MOV</span>
    </label>

    <div class="bar-track" id="bar-track" hidden>
      <div class="bar-fill" id="bar-fill"></div>
    </div>
    <div class="status" id="status"></div>
    <button id="go" disabled>Upload</button>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const dropLabel = document.getElementById('drop-label');
    const goBtn = document.getElementById('go');
    const statusEl = document.getElementById('status');
    const barTrack = document.getElementById('bar-track');
    const barFill = document.getElementById('bar-fill');
    let chosenFile = null;

    function setFile(f) {
      chosenFile = f;
      dropLabel.textContent = f ? `${f.name} (${(f.size / (1024*1024*1024)).toFixed(2)} GB)` : 'Click to choose a video, or drag one here';
      goBtn.disabled = !f;
      statusEl.textContent = '';
      statusEl.className = 'status';
    }

    fileInput.addEventListener('change', () => setFile(fileInput.files[0] || null));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('drag');
      if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
    });

    goBtn.addEventListener('click', async () => {
      if (!chosenFile) return;
      goBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Requesting upload URL...';
      barTrack.hidden = false;
      barFill.style.width = '0%';

      let signed;
      try {
        const res = await fetch('/api/uploads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: chosenFile.name, content_type: chosenFile.type || 'video/mp4' }),
        });
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        signed = await res.json();
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = `Could not start upload: ${err.message}`;
        goBtn.disabled = false;
        return;
      }

      statusEl.textContent = 'Uploading...';
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', signed.upload_url);
      xhr.setRequestHeader('Content-Type', signed.content_type);
      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          barFill.style.width = pct + '%';
          statusEl.textContent = `Uploading... ${pct}%`;
        }
      });
      xhr.addEventListener('load', () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          barFill.style.width = '100%';
          statusEl.className = 'status done';
          statusEl.textContent = `Done - saved to ${signed.path}`;
        } else {
          statusEl.className = 'status error';
          statusEl.textContent = `Upload failed (${xhr.status})`;
          goBtn.disabled = false;
        }
      });
      xhr.addEventListener('error', () => {
        statusEl.className = 'status error';
        statusEl.textContent = 'Upload failed - network error';
        goBtn.disabled = false;
      });
      xhr.send(chosenFile);
    });
  </script>
</body>
</html>
