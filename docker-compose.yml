services:
  label-ui:
    build: .
    ports:
      - "5050:5050"
    volumes:
      # candidate clips to label - point this at wherever clip_shots.py wrote them
      - ${CLIPS_DIR:-./clips}:/clips:ro
      # raw source videos - mounted at the same absolute path as the host so a
      # path typed/pasted from macOS (Finder, the address bar) resolves as-is
      # inside the container too, with no translation needed
      - ${VIDEO_DIR:-/Users/pengtan/Videos/20260725 Basketball Video}:/Users/pengtan/Videos/20260725 Basketball Video:ro
      # labels.json lives here so it persists outside the container
      - ./data/dataset:/app/data/dataset
