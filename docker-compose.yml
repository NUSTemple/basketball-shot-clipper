services:
  postgres:
    # v2 platform redesign's relational store (see src/shot_clipper/db/) -
    # for local/native dev and tests only. The hosted deployment points
    # SHOT_CLIPPER_DATABASE_URL at Supabase instead (see cloudbuild-v2.yaml);
    # jsonb (calibration_profiles.hoop_bbox_norm) rules out SQLite here.
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shot_clipper
      - POSTGRES_PASSWORD=shot_clipper
      - POSTGRES_DB=shot_clipper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  label-ui:
    build: .
    depends_on:
      - postgres
    environment:
      # hand detection jobs off to the `worker` service below instead of
      # spawning them itself - see jobs.py. Without this, restarting this
      # container would still be safe for an *already-running* job (it's a
      # separate container's process tree), but a job queued right as this
      # container goes down wouldn't get picked up until worker notices it
      # on its next poll anyway, so leaving this set is always correct here.
      - SHOT_CLIPPER_EXTERNAL_WORKER=1
      - SHOT_CLIPPER_DATABASE_URL=postgresql+psycopg://shot_clipper:shot_clipper@postgres:5432/shot_clipper
    ports:
      - "5050:5050"
    volumes:
      # candidate clips to label, and where Detect writes new ones - needs
      # to be read-write now that worker can actually cut clips, not just
      # label ones that already exist
      - ${CLIPS_DIR:-./clips}:/clips
      # raw source videos - the whole media root (see SHOT_CLIPPER_MEDIA_ROOT
      # in app.py), not just today's dated subfolder, so a new recording
      # session's folder shows up without editing this file again. Mounted
      # at the same absolute path as the host so a path typed/pasted from
      # macOS (Finder, the address bar) resolves as-is inside the container
      # too, with no translation needed. Read-write: output folders like
      # clips2/ commonly live as siblings of the source videos under this
      # same root, not just under the dedicated /clips mount above - the
      # app itself never writes to a source video's own path, only to
      # wherever clips_dir/out_dir point.
      - ${VIDEO_DIR:-/Users/pengtan/Videos}:/Users/pengtan/Videos
      # labels.json lives here so it persists outside the container
      - ./data/dataset:/app/data/dataset
      # hoop calibrations - Detect's in-browser "Calibrate hoop" writes here
      # even in Docker (unlike shot-clipper-calibrate's OpenCV window, which
      # needs to run natively); without this mount they'd only exist inside
      # the container and vanish on the next rebuild
      - ./data/configs:/app/data/configs
      # detector output (makes_sec timestamps) - same persistence reasoning
      # as data/configs above
      - ./data/ground_truth:/app/data/ground_truth
      # job status files - shared with `worker` below so both containers
      # see the same queue/progress (see jobstore.py)
      - ./data/jobs:/app/data/jobs
      # YOLO weights + trained filter - not tracked in git (see README Install)
      - ./models:/app/models:ro

  worker:
    build: .
    command: ["python", "-m", "shot_clipper.label_ui.jobs"]
    depends_on:
      - postgres
    environment:
      - SHOT_CLIPPER_DATABASE_URL=postgresql+psycopg://shot_clipper:shot_clipper@postgres:5432/shot_clipper
    volumes:
      - ${CLIPS_DIR:-./clips}:/clips
      - ${VIDEO_DIR:-/Users/pengtan/Videos}:/Users/pengtan/Videos
      - ./data/configs:/app/data/configs
      - ./data/ground_truth:/app/data/ground_truth
      - ./data/jobs:/app/data/jobs
      - ./models:/app/models:ro

volumes:
  postgres-data:
