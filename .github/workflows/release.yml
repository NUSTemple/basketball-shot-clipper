name: Release Windows installer

# ISCC.exe (Inno Setup) only runs on Windows, so the installer can't be built
# on the maintainer's Mac - this workflow does it on a windows-latest runner
# instead. Push a version tag to cut a release; workflow_dispatch lets you
# test the build without publishing one.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: installer\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: shot-clipper-setup
          path: installer/dist/shot-clipper-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer/dist/shot-clipper-setup.exe --generate-notes
