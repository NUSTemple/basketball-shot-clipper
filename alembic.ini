[alembic]
script_location = src/shot_clipper/db/alembic
prepend_sys_path = .

# SHOT_CLIPPER_DATABASE_URL (read by env.py) is the real source of truth -
# this placeholder just keeps `alembic` runnable without extra flags when
# the env var isn't set (e.g. `alembic revision --autogenerate`, which never
# touches a live database).
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
