# CI/CD for the GCP-hosted deployment: on push to master, rebuild the image
# and redeploy label-ui, so the hosted app always matches what's on GitHub
# (see the Cloud Build trigger created for this repo).
#
# worker isn't deployed here yet - it still runs as a polling loop
# (jobs.run_poller), not the request-triggered HTTP service the cost-saving
# design calls for. Deploying it as-is would either run the wrong command or
# defeat scale-to-zero (a poll loop never exits, so it would bill
# continuously). Add it here once that code change lands.
#
# label-ui is deployed in single-user mode (SHOT_CLIPPER_MULTI_USER unset) -
# flipping that on requires Identity-Aware Proxy to already be in front of
# the service, or every request 401s, including the owner's own. Turn both
# on together once IAP is wired up.
#
# Layer caching: Cloud Build starts every build from zero, with no local
# Docker cache to reuse - so without help, every build re-downloads the
# `ml` extras' huge CUDA/torch wheels even when only app code changed. The
# Dockerfile already installs dependencies before COPY src specifically so
# Docker *can* cache that layer; pulling the previous :latest first and
# building --cache-from it is what actually lets that caching take effect
# across separate builds. First-ever build has nothing to pull yet (`|| true`
# so that doesn't fail the build); every build after that should skip
# re-fetching anything pyproject.toml/poetry.lock didn't change.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_IMAGE}:latest || true']

  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.label-ui', '--cache-from', '${_IMAGE}:latest',
           '-t', '${_IMAGE}:${BUILD_ID}', '-t', '${_IMAGE}:latest', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}:${BUILD_ID}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}:latest']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - label-ui
      - --image=${_IMAGE}:${BUILD_ID}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --port=5050
      - --labels=app=basketball-shot-clipper
      - --min-instances=0
      - --max-instances=1
      - --memory=1Gi
      - --cpu=1
      - --no-allow-unauthenticated
      - --set-env-vars=SHOT_CLIPPER_CLIPS_DIR=/data/clips,SHOT_CLIPPER_MEDIA_ROOT=/data/videos,SHOT_CLIPPER_JOBS_DIR=/data/_jobs,SHOT_CLIPPER_GCS_BUCKET=${_BUCKET}
      - --add-volume=name=data,type=cloud-storage,bucket=${_BUCKET}
      - --add-volume-mount=volume=data,mount-path=/data

images:
  - '${_IMAGE}:${BUILD_ID}'
  - '${_IMAGE}:latest'

substitutions:
  _REGION: asia-southeast1
  _BUCKET: shot-clipper-data
  _IMAGE: asia-southeast1-docker.pkg.dev/basketball-shot-clipper/shot-clipper/label-ui

options:
  logging: CLOUD_LOGGING_ONLY
