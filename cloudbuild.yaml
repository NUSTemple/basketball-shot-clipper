# CI/CD for the GCP-hosted deployment: on push to master, rebuild both
# images and redeploy both services, so the hosted app always matches
# what's on GitHub (see the Cloud Build trigger created for this repo).
#
# label-ui runs in multi-user mode (SHOT_CLIPPER_MULTI_USER=1) - safe now
# that IAP is actually in front of the service (every request would 401
# without it, including the owner's own).
#
# CONFIGS_DIR/GROUND_TRUTH_DIR/DATASET_DIR are pointed at the GCS mount on
# *both* services, not just label-ui - worker and label-ui are separate
# containers with separate ephemeral filesystems, so a calibration saved by
# one at the plain relative default would be invisible to the other, not
# just lost on a scale-to-zero restart (this is exactly what broke the
# first real end-to-end test).
#
# Layer caching: Cloud Build starts every build from zero, with no local
# Docker cache to reuse - so without help, every build re-downloads the
# `ml` extras' huge CUDA/torch wheels even when only app code changed. Both
# Dockerfiles already install dependencies before COPY src specifically so
# Docker *can* cache that layer; pulling each image's previous :latest first
# and building --cache-from it is what actually lets that caching take
# effect across separate builds. First-ever build of an image has nothing
# to pull yet (`|| true` so that doesn't fail the build); every build after
# that should skip re-fetching anything pyproject.toml/poetry.lock didn't
# change.
#
# worker's URL is predictable before it's ever deployed (Cloud Run's
# <service>-<project-number>.<region>.run.app form, not the random-hash
# one) - see label-ui's --set-env-vars below - so label-ui can be told
# where to wake it without a chicken-and-egg ordering problem between the
# two deploy steps.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_LABEL_UI_IMAGE}:latest || true']

  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.label-ui', '--cache-from', '${_LABEL_UI_IMAGE}:latest',
           '-t', '${_LABEL_UI_IMAGE}:${BUILD_ID}', '-t', '${_LABEL_UI_IMAGE}:latest', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_LABEL_UI_IMAGE}:${BUILD_ID}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_LABEL_UI_IMAGE}:latest']

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_WORKER_IMAGE}:latest || true']

  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile', '--cache-from', '${_WORKER_IMAGE}:latest',
           '-t', '${_WORKER_IMAGE}:${BUILD_ID}', '-t', '${_WORKER_IMAGE}:latest', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_WORKER_IMAGE}:${BUILD_ID}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_WORKER_IMAGE}:latest']

  # worker first: label-ui's own deploy references its URL, and a job
  # queued against a not-yet-updated worker just waits, harmlessly, rather
  # than a job queued against a worker whose deploy hasn't landed yet.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - worker
      - --image=${_WORKER_IMAGE}:${BUILD_ID}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --port=8080
      - --labels=app=basketball-shot-clipper
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --cpu=4
      # 16Gi is the platform *maximum* at 4 vCPU (confirmed the hard way:
      # requesting 32Gi here failed the deploy - 32Gi needs 8 vCPU minimum,
      # roughly double the compute cost, per Cloud Run's CPU/memory table).
      # 16Gi is also L4's own minimum, so this costs nothing extra over the
      # floor - comfortable headroom for CUDA/torch's overhead plus a full
      # local copy of the source video (see SHOT_CLIPPER_COPY_VIDEO_LOCALLY
      # below) for the video sizes actually in use so far (a few GB). A
      # genuinely ~20GB source video would need --cpu=8 --memory=32Gi - a
      # deliberate cost increase to make if/when that size actually shows
      # up, not a default to provision for now.
      - --memory=16Gi
      - --min-instances=0
      - --max-instances=1
      - --concurrency=1
      - --timeout=3600
      - --no-cpu-throttling
      - --no-allow-unauthenticated
      - --command=shot-clipper-worker-server
      - --args=--port=8080
      - --set-env-vars=SHOT_CLIPPER_CLIPS_DIR=/data/clips,SHOT_CLIPPER_MEDIA_ROOT=/data/videos,SHOT_CLIPPER_JOBS_DIR=/data/_jobs,SHOT_CLIPPER_CONFIGS_DIR=/data/configs,SHOT_CLIPPER_GROUND_TRUTH_DIR=/data/ground_truth,SHOT_CLIPPER_DATASET_DIR=/data/dataset,SHOT_CLIPPER_MODEL_PATH=/data/models/yolov8l.pt,SHOT_CLIPPER_COPY_VIDEO_LOCALLY=1
      - --add-volume=name=data,type=cloud-storage,bucket=${_BUCKET}
      - --add-volume-mount=volume=data,mount-path=/data

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - label-ui
      - --image=${_LABEL_UI_IMAGE}:${BUILD_ID}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --port=5050
      - --labels=app=basketball-shot-clipper
      - --min-instances=0
      - --max-instances=1
      - --memory=1Gi
      - --cpu=1
      - --no-allow-unauthenticated
      - --set-env-vars=SHOT_CLIPPER_CLIPS_DIR=/data/clips,SHOT_CLIPPER_MEDIA_ROOT=/data/videos,SHOT_CLIPPER_JOBS_DIR=/data/_jobs,SHOT_CLIPPER_CONFIGS_DIR=/data/configs,SHOT_CLIPPER_GROUND_TRUTH_DIR=/data/ground_truth,SHOT_CLIPPER_DATASET_DIR=/data/dataset,SHOT_CLIPPER_GCS_BUCKET=${_BUCKET},SHOT_CLIPPER_WORKER_URL=https://worker-440216561039.${_REGION}.run.app,SHOT_CLIPPER_MULTI_USER=1,SHOT_CLIPPER_VERSION=${SHORT_SHA}
      - --add-volume=name=data,type=cloud-storage,bucket=${_BUCKET}
      - --add-volume-mount=volume=data,mount-path=/data

images:
  - '${_LABEL_UI_IMAGE}:${BUILD_ID}'
  - '${_LABEL_UI_IMAGE}:latest'
  - '${_WORKER_IMAGE}:${BUILD_ID}'
  - '${_WORKER_IMAGE}:latest'

substitutions:
  _REGION: asia-southeast1
  _BUCKET: shot-clipper-data
  _LABEL_UI_IMAGE: asia-southeast1-docker.pkg.dev/basketball-shot-clipper/shot-clipper/label-ui
  _WORKER_IMAGE: asia-southeast1-docker.pkg.dev/basketball-shot-clipper/shot-clipper/worker

options:
  logging: CLOUD_LOGGING_ONLY
